name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar pagina web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Criar projeto Android
        run: npx cap add android

      - name: Plugin de impressao e botao voltar
        run: |
          PKG=android/app/src/main/java/br/com/orcaja/app
          mkdir -p "$PKG"
          cat > "$PKG/PrintPlugin.java" <<'JAVA'
          package br.com.orcaja.app;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "PrintDoc")
          public class PrintPlugin extends Plugin {
            @PluginMethod
            public void print(final PluginCall call) {
              final String title = call.getString("title", "Orcamento");
              getActivity().runOnUiThread(new Runnable() {
                @Override
                public void run() {
                  try {
                    WebView wv = getBridge().getWebView();
                    PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                    PrintDocumentAdapter adapter = wv.createPrintDocumentAdapter(title);
                    PrintAttributes attrs = new PrintAttributes.Builder()
                        .setMediaSize(PrintAttributes.MediaSize.ISO_A4).build();
                    pm.print(title, adapter, attrs);
                    call.resolve();
                  } catch (Exception e) {
                    call.reject(String.valueOf(e.getMessage()));
                  }
                }
              });
            }
          }
          JAVA
          cat > "$PKG/MainActivity.java" <<'JAVA'
          package br.com.orcaja.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(PrintPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA

      - name: Icone do app
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          for pair in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $pair
            convert icon.png -resize "${2}x${2}" "$RES/mipmap-$1/ic_launcher.png"
            convert icon.png -resize "${2}x${2}" "$RES/mipmap-$1/ic_launcher_round.png"
            convert icon-fg.png -resize "${3}x${3}" "$RES/mipmap-$1/ic_launcher_foreground.png"
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#0F6B53</color>\n</resources>\n' > "$RES/values/ic_launcher_background.xml"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OrcaJa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
